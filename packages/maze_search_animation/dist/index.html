<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>迷路探索アニメーション</title>
        <link href="style.css" rel="stylesheet" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div id="maze_container">
            <canvas id="maze"></canvas>

            <div class="controls">
                <button id="new_maze_btn">新しい迷路</button>
                <button id="dfs_btn">DFS探索</button>
                <button id="bfs_btn">BFS探索</button>
                <button id="astar_btn">A*探索</button>
            </div>
            <div class="info" id="info">ボタンをクリックして探索開始</div>
        </div>
        <div id="input_container">
            <select name="maze_size" id="maze_size_select">
                <option value="">サイズ変更</option>
                <option value="21">21</option>
                <option value="51">51</option>
                <option value="71">71</option>
                <option value="101">101</option>
            </select>
            <div class="legend">
                <div class="legend-item">
                    <div
                        class="legend-box"
                        style="background-color: #ff0000"
                    ></div>
                    <span>スタート</span>
                </div>
                <div class="legend-item">
                    <div
                        class="legend-box"
                        style="background-color: #00ff00"
                    ></div>
                    <span>ゴール</span>
                </div>
                <div class="legend-item">
                    <div
                        class="legend-box"
                        style="background-color: #0000ff"
                    ></div>
                    <span>探索済み</span>
                </div>
                <div class="legend-item">
                    <div
                        class="legend-box"
                        style="background-color: #000000"
                    ></div>
                    <span>壁</span>
                </div>
                <div class="legend-item">
                    <div
                        class="legend-box"
                        style="background-color: #ffffff"
                    ></div>
                    <span>通路</span>
                </div>
            </div>
        </div>
    </body>
</html>
